# Scheduled Security：定期依赖审计、凭据风险检查与历史扫描。
# main 推送与 PR 都会跑历史扫描与 pnpm audit；ci.yml 的 security job 另有更快的 PR 工作树门禁。
# PR 事件下 checkout 固定到 head SHA：self-hosted runner 从本地仓库镜像取代码，拿不到 GitHub 生成的 merge commit。
name: Security

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: patmail-extension
    shell: bash

jobs:
  secret-scan:
    name: Secret Scan（工作树 + Git 历史）
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # 历史扫描需要完整提交历史
      - uses: ./.github/actions/setup-patmail
      - name: 工作树扫描
        run: node scripts/scan-secrets.mjs
      - name: Git 历史扫描（指纹登记见 ci/secret-allowlist.json）
        run: node scripts/scan-secrets.mjs --history
      - name: 上传扫描报告
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: report-secret-scan
          path: patmail-extension/test-results/ci
          retention-days: 30

  dependency-audit:
    name: Dependency Audit
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-patmail
      - name: pnpm audit（prod 依赖，high 及以上失败）
        run: pnpm audit:deps
      - name: 锁文件完整性（--frozen-lockfile 已在安装阶段校验）
        run: node -e "console.log('lockfile ok:', require('./package.json').packageManager)"
      - name: 直接依赖许可策略
        run: node scripts/license-check.mjs
      - name: 上传审计报告
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: report-dependency-audit
          path: patmail-extension/test-results/ci
          retention-days: 30
