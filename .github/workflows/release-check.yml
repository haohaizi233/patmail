# 发布前校验：版本一致性、可复现构建、产物安全、测试摘要、SHA-256 清单。
# 明确不做：Chrome Web Store 发布、CRX 签名、访问/轮换签名私钥（历史 dist.pem 只作风险登记）。
name: Release Check

# 发布校验必须提供真实客户快照，不能使用 CI 的空占位名单。
env:
  SME_SNAPSHOT_STUB: "0"

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: patmail-extension
    shell: bash

jobs:
  release-check:
    name: Release Check
    runs-on: [self-hosted, Windows, X64]
    env:
      # Windows 下 paths.mjs 顶层 cpSync 解压副本会使 node 0xC0000409 崩溃，
      # 用 dist 绝对路径绕过隔离复制（本地已验证）。
      PATMAIL_TEST_DIST: ${{ github.workspace }}/patmail-extension/dist
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-patmail
      - name: 测试（单元 / 集成 / 回归）
        run: node scripts/ci-check.mjs --steps unit,integration,regression
      - name: 两次构建比对（可复现性）
        run: node scripts/verify-reproducible.mjs
      - name: Manifest 与构建产物校验
        run: node scripts/ci-check.mjs --steps manifest,dist
      - name: 密钥扫描（交付前最后一次）
        run: node scripts/scan-secrets.mjs
      - name: 缓存 Playwright 浏览器
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('patmail-extension/pnpm-lock.yaml') }}
      - name: 安装 Chromium（Windows 无系统依赖步骤）
        run: npx playwright install chromium
      - name: E2E Smoke
        run: node scripts/run-e2e.mjs smoke
      - name: 打包源码与交付件（系统 tar 即 bsdtar，生成 zip）
        run: |
          export PATH="/c/Windows/System32:$PATH" # 确保 tar 解析到系统 bsdtar 而非 Git Bash 的 GNU tar
          tar --version | head -1
          TAR=tar pnpm pack:source
          TAR=tar pnpm pack:delivery
          TAR=tar pnpm verify:archive
      - name: 发布前校验（版本 / 摘要 / SHA-256 / 产物名称）
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node scripts/release-check.mjs ${RELEASE_TAG:+--tag $RELEASE_TAG}
      - name: 上传发布校验产物
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: release-bundle
          path: |
            patmail-extension/test-results/patmail-source.zip
            patmail-extension/test-results/patmail-delivery.zip
            patmail-extension/test-results/ci
            patmail-extension/test-results/coverage
          retention-days: 7
