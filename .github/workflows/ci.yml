# PR 质量门禁主流水线（Fast Gate）。
# 结构见 docs/ci/architecture.md：
#   Static Checks ─┐
#   Unit/Integration ┼─→ Build & Artifact Verification ─→ E2E Smoke ─→ CI Gate
#   Regression ─────┤
#   Security ───────┘
# 权限最小化：只读 contents；不接触任何 Secret；并发取消只作用于同分支/同 PR。
name: CI

# PR 事件下 checkout 固定到 head SHA：self-hosted runner 从本地仓库镜像取代码，拿不到 GitHub 生成的 merge commit。
env:
  SME_SNAPSHOT_STUB: "1"

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: patmail-extension
    shell: bash

jobs:
  static:
    name: Static Checks
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-patmail
      - name: Typecheck / Lint / Format
        run: node scripts/ci-check.mjs --steps typecheck,lint,format
      - name: 上传静态检查报告
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: report-static
          path: |
            patmail-extension/test-results/ci
          retention-days: 14

  unit-integration:
    name: Unit & Integration Tests
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-patmail
      - name: 单元 + 集成测试（JUnit 产物）
        run: node scripts/ci-check.mjs --steps unit,integration
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: report-unit
          path: |
            patmail-extension/test-results/ci
            patmail-extension/test-results/junit
          retention-days: 14

  regression:
    name: Regression Tests
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-patmail
      - name: 历史业务契约回归（JUnit 产物）
        run: node scripts/ci-check.mjs --steps regression
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: report-regression
          path: |
            patmail-extension/test-results/ci
            patmail-extension/test-results/junit
          retention-days: 14

  security:
    name: Security (Secrets / Licenses)
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-patmail
      - name: 密钥扫描（工作树）+ 许可策略
        run: node scripts/ci-check.mjs --steps secrets,licenses
      - name: 上传扫描报告
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: report-security
          path: |
            patmail-extension/test-results/ci
          retention-days: 14

  build:
    name: Build & Artifact Verification
    needs: [static, unit-integration, regression]
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-patmail
      - name: 构建 + Manifest 校验 + 产物校验
        run: node scripts/ci-check.mjs --steps build,manifest,dist
      - name: 本地缓存构建产物（self-hosted 极速复用）
        if: success()
        run: node -e "const fs=require('fs'),path=require('path');const cacheDir=path.join(process.env.RUNNER_WORKSPACE||'..','_dist_cache');fs.mkdirSync(cacheDir,{recursive:true});fs.cpSync('dist',path.join(cacheDir,'dist'),{recursive:true,force:true});console.log('Dist cached to',path.join(cacheDir,'dist'))"
      - name: 上传构建产物
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: extension-dist
          path: patmail-extension/dist
          retention-days: 1
      - name: 上传校验报告
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: report-build
          path: |
            patmail-extension/test-results/ci
          retention-days: 14

  e2e-smoke:
    name: E2E Smoke
    needs: [build]
    runs-on: [self-hosted, Windows, X64]
    env:
      # Windows 下 paths.mjs 顶层 cpSync 解压副本会使 node 0xC0000409 崩溃，
      # 用 dist 绝对路径绕过隔离复制（本地已验证）。
      PATMAIL_TEST_DIST: ${{ github.workspace }}/patmail-extension/dist
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-patmail
      - name: 安装 Chromium（Windows 无系统依赖步骤）
        run: npx playwright install chromium
      - name: 下载构建产物
        id: dist-artifact
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension-dist
          path: patmail-extension/dist
      - name: 从本地缓存恢复构建产物
        if: steps.dist-artifact.outcome != 'success'
        run: node -e "const fs=require('fs'),path=require('path');const cacheDir=path.join(process.env.RUNNER_WORKSPACE||'..','_dist_cache','dist');if(fs.existsSync(cacheDir)){fs.mkdirSync('dist',{recursive:true});fs.cpSync(cacheDir,'dist',{recursive:true,force:true});console.log('Dist restored from cache')}else{console.log('No cache found at',cacheDir)}"
      - name: 构建产物缺失时本地构建兜底（artifact 上传失败不再连坐）
        if: steps.dist-artifact.outcome != 'success'
        run: node -e "const fs=require('fs'),cp=require('child_process');if(!fs.existsSync('dist/manifest.json')){console.log('Building dist fallback...');cp.execSync('node scripts/ci-check.mjs --steps build',{stdio:'inherit'})}else{console.log('dist/manifest.json already exists, skipping build')}"
      - name: E2E Smoke（扩展启动 / EASY 绑定 / 文件查询 / 期限查询）
        run: node scripts/run-e2e.mjs smoke
      - name: 上传 E2E 报告与失败证据
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: report-e2e-smoke
          path: |
            patmail-extension/test-results/ci
            patmail-extension/test-results/*.png
            patmail-extension/test-results/*.txt
            patmail-extension/test-results/*.json
          retention-days: 14

  ci-gate:
    name: CI Gate
    needs: [static, unit-integration, regression, security, build, e2e-smoke]
    if: always()
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: 汇总各 Job 报告
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: report-*
          merge-multiple: true
          path: patmail-extension/test-results
      - name: 全部 Job 必须 success
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: >-
          node -e "const n=JSON.parse(process.env.NEEDS_JSON);
          const bad=Object.entries(n).filter(([,v])=>v.result!=='success');
          if(bad.length){console.error('未通过的 Job：'+bad.map(([k,v])=>k+'='+v.result).join(', '));process.exit(1)}
          console.log('全部 Job 通过：'+Object.keys(n).join(', '))"
      - name: CI 报告与汇总门禁
        run: node scripts/ci-report.mjs --gate
      - name: 上传最终 CI 报告
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: ci-summary
          path: |
            patmail-extension/test-results/ci/summary.json
            patmail-extension/test-results/ci/summary.md
          retention-days: 30
