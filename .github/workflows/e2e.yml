# Full Gate：main 推送 / PR / 手动触发的完整验证。
# PR 事件下 checkout 固定到 head SHA：self-hosted runner 从本地仓库镜像取代码，拿不到 GitHub 生成的 merge commit。
# 覆盖：完整测试产物、全量浏览器回归、下载故障注入与续传、旧桥接协议兼容、覆盖率、构建可复现性。
name: E2E Full

env:
  SME_SNAPSHOT_STUB: "1"

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: patmail-extension
    shell: bash

jobs:
  build:
    name: Build
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-patmail
      - name: 构建
        run: node scripts/ci-check.mjs --steps build,manifest,dist
      - name: 本地缓存构建产物（self-hosted 极速复用）
        if: success()
        run: node -e "const fs=require('fs'),path=require('path');const cacheDir=path.join(process.env.RUNNER_WORKSPACE||'..','_dist_cache');fs.mkdirSync(cacheDir,{recursive:true});fs.cpSync('dist',path.join(cacheDir,'dist'),{recursive:true,force:true});console.log('Dist cached to',path.join(cacheDir,'dist'))"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: extension-dist
          path: patmail-extension/dist
          retention-days: 1

  e2e-full:
    name: E2E Full (${{ matrix.group }})
    needs: [build]
    runs-on: [self-hosted, Windows, X64]
    env:
      # Windows 下 paths.mjs 顶层 cpSync 解压副本会使 node 0xC0000409 崩溃，
      # 用 dist 绝对路径绕过隔离复制（本地已验证）。
      PATMAIL_TEST_DIST: ${{ github.workspace }}/patmail-extension/dist
    strategy:
      fail-fast: false
      matrix:
        group: [full-functional, full-lifetime]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-patmail
      - name: 安装 Chromium（Windows 无系统依赖步骤）
        run: npx playwright install chromium
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: dist-artifact
        continue-on-error: true
        with:
          name: extension-dist
          path: patmail-extension/dist
      - name: 从本地缓存恢复构建产物
        if: steps.dist-artifact.outcome != 'success'
        run: node -e "const fs=require('fs'),path=require('path');const cacheDir=path.join(process.env.RUNNER_WORKSPACE||'..','_dist_cache','dist');if(fs.existsSync(cacheDir)){fs.mkdirSync('dist',{recursive:true});fs.cpSync(cacheDir,'dist',{recursive:true,force:true});console.log('Dist restored from cache')}else{console.log('No cache found at',cacheDir)}"
      - name: 构建产物缺失时本地构建兜底（artifact 上传失败不再连坐）
        if: steps.dist-artifact.outcome != 'success'
        run: node -e "const fs=require('fs'),cp=require('child_process');if(!fs.existsSync('dist/manifest.json')){console.log('Building dist fallback...');cp.execSync('node scripts/ci-check.mjs --steps build',{stdio:'inherit'})}else{console.log('dist/manifest.json already exists, skipping build')}"
      - name: 执行 Full E2E
        run: node scripts/run-e2e.mjs ${{ matrix.group }}
      - name: 上传报告与失败证据
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: report-e2e-${{ matrix.group }}
          path: |
            patmail-extension/test-results/ci
            patmail-extension/test-results/junit
            patmail-extension/test-results/*.png
            patmail-extension/test-results/*.txt
            patmail-extension/test-results/*.json
          retention-days: 7

  e2e-legacy:
    name: Legacy Compatibility（旧桥接下载协议）
    needs: [build]
    runs-on: [self-hosted, Windows, X64]
    env:
      # Windows 下 paths.mjs 顶层 cpSync 解压副本会使 node 0xC0000409 崩溃，
      # 用 dist 绝对路径绕过隔离复制（本地已验证）。
      PATMAIL_TEST_DIST: ${{ github.workspace }}/patmail-extension/dist
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-patmail
      - name: 安装 Python（桥接协议与 ZIP 校验）
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: 安装 Chromium（Windows 无系统依赖步骤）
        run: npx playwright install chromium
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: dist-artifact
        continue-on-error: true
        with:
          name: extension-dist
          path: patmail-extension/dist
      - name: 从本地缓存恢复构建产物
        if: steps.dist-artifact.outcome != 'success'
        run: node -e "const fs=require('fs'),path=require('path');const cacheDir=path.join(process.env.RUNNER_WORKSPACE||'..','_dist_cache','dist');if(fs.existsSync(cacheDir)){fs.mkdirSync('dist',{recursive:true});fs.cpSync(cacheDir,'dist',{recursive:true,force:true});console.log('Dist restored from cache')}else{console.log('No cache found at',cacheDir)}"
      - name: 构建产物缺失时本地构建兜底（artifact 上传失败不再连坐）
        if: steps.dist-artifact.outcome != 'success'
        run: node -e "const fs=require('fs'),cp=require('child_process');if(!fs.existsSync('dist/manifest.json')){console.log('Building dist fallback...');cp.execSync('node scripts/ci-check.mjs --steps build',{stdio:'inherit'})}else{console.log('dist/manifest.json already exists, skipping build')}"
      - name: 执行 Legacy E2E + Python 桥接单测
        run: node scripts/run-e2e.mjs legacy
      - name: 上传报告与失败证据
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: report-e2e-legacy
          path: |
            patmail-extension/test-results/ci
            patmail-extension/test-results/junit
            patmail-extension/test-results/*.png
            patmail-extension/test-results/*.txt
            patmail-extension/test-results/*.json
          retention-days: 7

  coverage:
    name: Coverage
    needs: [build]
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-patmail
      - name: 全量测试 + 覆盖率
        run: pnpm test:coverage
      - name: 覆盖率防退化门禁
        run: node scripts/ci-report.mjs --coverage-gate
      - name: 上传覆盖率
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: report-coverage
          path: |
            patmail-extension/test-results/coverage
            patmail-extension/test-results/ci
          retention-days: 3

  reproducible-build:
    name: Reproducible Build
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-patmail
      - name: 两次独立构建比对 Hash
        run: node scripts/verify-reproducible.mjs
      - name: 上传可复现性报告
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: report-repro
          path: |
            patmail-extension/test-results/ci
          retention-days: 3

  e2e-gate:
    name: Full Gate
    needs: [build, e2e-full, e2e-legacy, coverage, reproducible-build]
    if: always()
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: report-*
          merge-multiple: true
          path: patmail-extension/test-results
      - name: 全部 Job 必须 success
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: >-
          node -e "const n=JSON.parse(process.env.NEEDS_JSON);
          const bad=Object.entries(n).filter(([,v])=>v.result!=='success');
          if(bad.length){console.error('未通过的 Job：'+bad.map(([k,v])=>k+'='+v.result).join(', '));process.exit(1)}
          console.log('全部 Job 通过：'+Object.keys(n).join(', '))"
      - name: CI 报告与汇总门禁
        run: node scripts/ci-report.mjs --gate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        if: always()
        with:
          name: full-gate-summary
          path: |
            patmail-extension/test-results/ci/summary.json
            patmail-extension/test-results/ci/summary.md
          retention-days: 7
